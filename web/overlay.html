<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heart Rate</title>
<!--
  OBS overlay. Options via query string, e.g. /?color=ffffff&size=120&label=0&status=0
    color   hex accent color (default ff4d5e)
    size    font size of the number in px (default 160)
    label   show "BPM" under the number (1/0, default 1)
    status  show connection text when there is no data (1/0, default 1)
-->
<style>
  :root { --accent: #ff4d5e; --size: 160px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "SF Pro Display", "Segoe UI", "Inter", system-ui, sans-serif;
    color: #fff; user-select: none;
  }
  .wrap { display: flex; align-items: center; gap: calc(var(--size) * 0.12); }
  .heart {
    width: calc(var(--size) * 0.55); height: calc(var(--size) * 0.55);
    fill: var(--accent); transform-origin: 50% 55%;
    animation: beat var(--period, 1s) ease-out infinite;
  }
  .idle .heart { animation: none; opacity: .35; }
  @keyframes beat { 0% { transform: scale(1.12); } 30%, 100% { transform: scale(1); } }
  .num {
    font-size: var(--size); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .35);
  }
  .unit {
    font-size: calc(var(--size) * 0.16); font-weight: 600; letter-spacing: .2em;
    opacity: .7; margin-top: calc(var(--size) * 0.04);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
  }
  .status { font-size: calc(var(--size) * 0.14); opacity: .7; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap idle" id="wrap">
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <div>
      <div class="num" id="num">--</div>
      <div class="unit" id="unit">BPM</div>
      <div class="status" id="status" hidden></div>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  if (/^[0-9a-f]{3,8}$/i.test(q.get('color') || '')) root.setProperty('--accent', '#' + q.get('color'));
  if (+q.get('size') > 0) root.setProperty('--size', +q.get('size') + 'px');
  const showLabel = q.get('label') !== '0';
  const showStatus = q.get('status') !== '0';

  const wrap = document.getElementById('wrap');
  const num = document.getElementById('num');
  const unit = document.getElementById('unit');
  const status = document.getElementById('status');
  unit.hidden = !showLabel;

  function render(d) {
    const live = d.connected && d.bpm;
    wrap.classList.toggle('idle', !live);
    num.textContent = live ? d.bpm : '--';
    if (live) root.setProperty('--period', (60 / d.bpm).toFixed(3) + 's');
    status.textContent = d.status_text || '';
    status.hidden = live || !showStatus;
    unit.hidden = !showLabel || (!live && showStatus);
  }

  function connect() {
    const es = new EventSource('/events');
    es.onmessage = e => render(JSON.parse(e.data));
    es.onerror = () => { es.close(); render({ status_text: 'App is not running' }); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>

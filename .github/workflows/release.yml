name: Release

# Push a tag like v0.2.0 to build every platform and publish a GitHub release.
# Run it by hand (workflow_dispatch) to get the same artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/miband-heart-rate.exe dist/
          Compress-Archive dist/miband-heart-rate.exe miband-heart-rate-windows-x86_64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: miband-heart-rate-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal app bundle
        run: |
          mkdir -p dist
          lipo -create -output dist/miband-heart-rate \
            target/aarch64-apple-darwin/release/miband-heart-rate \
            target/x86_64-apple-darwin/release/miband-heart-rate
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          scripts/bundle-macos.sh dist/miband-heart-rate "$version" dist
          cd dist && ditto -c -k --keepParent "MiBand Heart Rate.app" ../miband-heart-rate-macos-universal.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: miband-heart-rate-macos-universal.zip

  linux:
    # Older Ubuntu → older glibc → the binary runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        run: tar -czf miband-heart-rate-linux-x86_64.tar.gz -C target/release miband-heart-rate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: miband-heart-rate-linux-x86_64.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum miband-heart-rate-* > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            miband-heart-rate-*
            SHA256SUMS

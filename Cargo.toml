[package]
name = "miband-heart-rate"
authors = ["Tnze", "fosoaq"]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Live heart rate from Xiaomi Smart Band (BLE Heart Rate broadcast) with a tray app and an OBS overlay"
license = "MIT"
repository = "https://github.com/fosoaq/miband-heart-rate"

[dependencies]
anyhow = "1"
axum = "0.8"
bluest = "0.6.9"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
futures-lite = "2.6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# `cargo deb` (Linux release): binary, menu entry and icon.
[package.metadata.deb]
maintainer = "fosoaq <fosoaq@proton.me>"
section = "utils"
priority = "optional"
depends = "$auto, bluez"
extended-description = """\
Reads the heart rate a Xiaomi Smart Band broadcasts over Bluetooth LE (or any \
device with the standard Heart Rate service). Tray app with a small window, plus \
transparent widgets for OBS Browser sources served on 127.0.0.1."""
assets = [
    ["target/release/miband-heart-rate", "usr/bin/", "755"],
    ["assets/miband-heart-rate.desktop", "usr/share/applications/", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/miband-heart-rate.png", "644"],
    ["README.md", "usr/share/doc/miband-heart-rate/", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true

# objc2 checks Objective-C method signatures in debug builds, and its NSUUID
# binding trips that check on recent macOS (`getUUIDBytes:` is reported as
# taking `char*`), aborting as soon as a Bluetooth device is opened. Release
# builds never run the check; match them here.
[profile.dev.package.objc2]
debug-assertions = false

[profile.dev.package.objc2-foundation]
debug-assertions = false
